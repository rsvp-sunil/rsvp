<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Siddharth Reception – VIP Management</title>
<meta name="theme-color" content="#7a1315">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
  html, body { margin: 0; height: 100%; background: #fbf9f5; }
  body { overflow: hidden; }
  iframe { display: block; width: 100%; height: 100vh; height: 100dvh; border: 0; }
  .fallback { font-family: Georgia, serif; text-align: center; padding: 30vh 20px 0; color: #2b2523; }
</style>
<script src="/config.js"></script>
</head>
<body>
<iframe id="app" title="Siddharth Reception VIP Management" allow="clipboard-write"></iframe>
<noscript><p class="fallback">Please turn on JavaScript to sign in.</p></noscript>
<script>
  (function () {
    var url = window.RSVP_APP_URL;
    var frame = document.getElementById('app');
    if (!url || url.indexOf('/exec') < 0) { frame.outerHTML = '<p class="fallback">The organiser app isn’t connected yet.</p>'; return; }
    frame.src = url + '?page=admin';
  })();
</script>
</body>
</html>
