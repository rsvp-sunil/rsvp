<style>
  html, body { margin: 0; height: 100%; background: #ffffff; }
  body { overflow: hidden; }
  iframe { display: block; width: 100%; height: 100vh; height: 100dvh; border: 0; }
  .fallback { font-family: Georgia, serif; text-align: center; padding: 30vh 20px 0; color: #2b2523; }
  .fallback a { color: #7a1315; font-weight: 600; }
  #splash { position: fixed; inset: 0; z-index: 5; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: #fbf9f5; font-family: Georgia, 'Times New Roman', serif; color: #7a1315; transition: opacity .45s ease; }
  #splash img { width: 110px; height: auto; mix-blend-mode: multiply; }
  #splash .t { font-size: 26px; font-style: italic; }
  #splash .s { font-size: 14px; color: #685f57; letter-spacing: .04em; }
  #splash .dots span { display: inline-block; width: 8px; height: 8px; margin: 0 4px; border-radius: 50%; background: #8f805d; animation: b 1.1s infinite ease-in-out; }
  #splash .dots span:nth-child(2) { animation-delay: .15s; } #splash .dots span:nth-child(3) { animation-delay: .3s; }
  @keyframes b { 0%, 80%, 100% { transform: scale(.5); opacity: .4; } 40% { transform: scale(1); opacity: 1; } }
  #splash.gone { opacity: 0; pointer-events: none; }
</style>
<script src="/config.js"></script>
</head>
<body>
<div id="splash" role="status" aria-live="polite"><img src="/logo.webp" alt="" width="110" height="139"><div class="t">Wedding Reception</div><div class="s">Siddharth &amp; Hyein · opening your RSVP</div><div class="dots" aria-hidden="true"><span></span><span></span><span></span></div></div>
<iframe id="app" title="Siddharth Reception RSVP" allow="clipboard-write"></iframe>
<noscript><p class="fallback">Please turn on JavaScript to RSVP.</p></noscript>
<script>
  (function () {
    var url = window.RSVP_APP_URL;
    var frame = document.getElementById('app');
    if (!url || url.indexOf('/exec') < 0) {
      document.getElementById('splash').remove(); frame.outerHTML = '<p class="fallback">The RSVP will open here shortly. Please check back soon.</p>';
      return;
    }
        var sp = document.getElementById('splash'), hide = function () { if (sp) { var el = sp; sp = null; el.className = 'gone'; setTimeout(function () { el.remove(); }, 500); } };
    // the app tells us when it is fully drawn; until then the logo screen stays on top
    window.addEventListener('message', function (e) { if (e.data && e.data.rsvpReady) hide(); });
    frame.addEventListener('load', function () { setTimeout(hide, 12000); });
    setTimeout(hide, 25000);
    frame.src = url;
  })();
</script>
</body>
